name: .NET

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test (golden values shared with Python)
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

      - name: Sample
        run: dotnet run -c Release --no-build --project samples/MatchListings -- ../examples/listings.csv

      - name: Pack (validation)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/DedupKit -c Release --no-build -o artifacts
