[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dedupkit-br"
version = "0.1.1"
description = "Find listings that are the same product in Brazilian Portuguese data: fingerprints, a Portuguese phonetic key, plural reduction, barcode rules and an attribute check (sizes, voltages, colours). Same results as the .NET version."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Caique Dourado" }]
keywords = ["deduplication", "record-linkage", "entity-resolution", "product-matching", "portuguese", "pt-br", "fingerprint", "phonetic", "gtin", "ean"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
dedupkit-br = "dedupkit_br.cli:main"

[project.urls]
Homepage = "https://github.com/CaiqueDourado/DedupKit"
Issues = "https://github.com/CaiqueDourado/DedupKit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dedupkit_br"]

[tool.pytest.ini_options]
testpaths = ["tests"]
